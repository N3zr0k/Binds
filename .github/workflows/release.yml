name: Release

# Releases are driven by the TOC version: a version without a tag is a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from TOC
        id: version
        run: |
          version=$(grep -m1 '^## Version:' Binds/Binds.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in
            *-alpha.*) echo "stage=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta.*)  echo "stage=beta"  >> "$GITHUB_OUTPUT" ;;
            *)         echo "stage=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Lint
        if: steps.version.outputs.new == 'true'
        uses: lunarmodules/luacheck@v1
        with:
          args: .

      - name: Create tag
        if: steps.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # The packager skips push builds whose HEAD already carries a tag ("Found future tag ... not packaging"),
      # because it expects a second run for the tag push. Tags pushed with GITHUB_TOKEN start no new run, so
      # the script runs here directly with the tag as ref.
      # Alpha builds never go to CurseForge: the API key is only passed for beta and release.
      - name: Package (and upload to CurseForge)
        if: steps.version.outputs.new == 'true'
        env:
          CF_API_KEY: ${{ steps.version.outputs.stage != 'alpha' && secrets.CF_API_KEY || '' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/${{ steps.version.outputs.version }}" bash "$RUNNER_TEMP/release.sh" -n "{package-name}-{project-version}"

      - name: GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          # Fail with a readable message instead of gh's "no matches found" when the packager produced nothing.
          shopt -s nullglob
          zips=(.release/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::Packager created no ZIP in .release/. Contents:"
            ls -la .release || true
            exit 1
          fi
          case "${{ steps.version.outputs.stage }}" in
            alpha) gh release create "$version" .release/*.zip --title "$version" --prerelease --notes-file CHANGELOG.md ;;
            beta)  gh release create "$version" .release/*.zip --title "$version (Beta)" --notes-file CHANGELOG.md ;;
            *)     gh release create "$version" .release/*.zip --title "$version" --notes-file CHANGELOG.md ;;
          esac
